services:
  searxng:
    build:
      context: .
      dockerfile: search.dockerfile
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-a2fb23f1b02e6ee83875b09826990de0f6bd908b6638e8c10277d415f6ab852b}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
    networks:
      - future-search

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - future-search

  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    volumes:
      - ./scripts/ollama-init.sh:/ollama-init.sh:ro
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    networks:
      - future-search
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      WS_PATH: /ws
      SEARXNG_URL: http://searxng:8080
      OLLAMA_BASE_URL: http://ollama:11434
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SIMILARITY_MEASURE: ${SIMILARITY_MEASURE:-cosine}
      SELECTED_MODEL_ID: ${SELECTED_MODEL_ID:-openrouter-auto-free}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    networks:
      - future-search

  frontend:
    build:
      context: .
      dockerfile: app.dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/ws}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NODE_ENV: production
    networks:
      - future-search

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - future-search

networks:
  future-search:
    driver: bridge

volumes:
  ollama_data:
